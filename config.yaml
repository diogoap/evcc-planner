# EVCC Trip Planner — system configuration (tracked in Git).
#
# Deployment-specific values and secrets come from environment variables (or
# an ignored .env file locally): EVCC_URL, GOOGLE_CALENDAR_ICAL_URL,
# GOOGLE_MAPS_API_KEY, OPENROUTER_API_KEY, KNMI_API_KEY. Also: EVCC_PLANNER_LISTEN, EVCC_PLANNER_DATA_DIR,
# EVCC_PLANNER_WEB_DIR, EVCC_PLANNER_DEMO. Optional overrides of this file go
# in config.local.yaml (ignored). Personal data is edited in the UI.

server:
  listen: 127.0.0.1:7201   # Docker sets 0.0.0.0:7201
  web_dir: web/dist

timezone: Europe/Amsterdam
data_dir: data

evcc:
  mode: live               # live | stub
  url: http://127.0.0.1:7070   # set the real address with EVCC_URL
  loadpoint: 1             # EVCC loadpoint index, starting at 1
  vehicle: ""              # EVCC vehicle name; empty = the loadpoint's or only vehicle
  poll_interval: 60s
  timeout: 10s

calendar:
  mode: ical               # ical | stub
  sync_interval: 1h
  # Environment variable with one or more secret iCal addresses, separated by
  # commas (Google Calendar > Settings > calendar > "Secret address in iCal
  # format"). Calendar names are read from the feeds.
  url_env: GOOGLE_CALENDAR_ICAL_URL

routes:
  mode: google             # google | stub (google without a key falls back to stub)
  api_key_env: GOOGLE_MAPS_API_KEY
  traffic_aware: true      # Compute Routes Pro; results cached per weekly time slot
  cache_ttl: 168h          # cached for 1 week
  monthly_free_calls: 5000 # free monthly Compute Routes Pro calls, shown on the Activity page

# Daily advice inputs. Fetched once a day at forecast.daily_at (failures retry
# hourly); the last valid forecast is kept when a fetch fails.
tibber:
  mode: live               # live | stub
  url: https://tibber.com/nl/stroomprijsprognose   # weekly price outlook article

openrouter:
  mode: live               # live | stub (live without a key uses the pattern-based stub)
  base_url: https://openrouter.ai/api/v1
  model: anthropic/claude-haiku-5.5   # must support structured outputs (strict JSON Schema)
  api_key_env: OPENROUTER_API_KEY
  timeout: 60s

knmi:
  mode: live               # live | stub (live without a key: no weather outlook)
  base_url: https://api.dataplatform.knmi.nl/open-data/v1
  dataset: outlook_weather_forecast   # KNMI's 7-day outlook ("middellange termijn")
  version: "1.0"
  api_key_env: KNMI_API_KEY

forecast:
  daily_at: "18:00"        # local time; Tibber publishes its outlook on Mondays around 17:00
  retry_interval: 1h
  vat_pct: 21              # converts the outlook's excl. market prices to incl. VAT

# History kept in the database. Older activity log entries, past manual
# trips, per-date trip edits, cached routes, plan records, and advice
# decisions are deleted daily. Schedules, places, and settings are kept.
retention:
  days: 90

# Bootstrap planning defaults. Values saved in Settings take precedence; the
# home address is only set in Settings.
defaults:
  usable_capacity_kwh: 59
  charge_power_kw: 3.68
  consumption_kwh_per_100km: 18
  arrival_reserve_pct: 15
  charging_efficiency_pct: 90
  departure_buffer_min: 15
  charge_buffer_min: 30
  default_stay_min: 15
  auto_plan_on_plug_in: true   # send the next departure's plan to EVCC when the car is plugged in

# EVCC Trip Planner — system configuration (tracked in Git).
#
# Integration settings that hold no secret (EVCC and Home Assistant addresses,
# loadpoint, sensors, poll and sync intervals, timeouts, route cache, model,
# forecast schedule, VAT, history retention) are edited in the UI under
# Settings → Connections and stored in the database.
#
# Secrets come from environment variables (or an ignored .env file locally):
# GOOGLE_CALENDAR_ICAL_URL, GOOGLE_MAPS_API_KEY, OPENROUTER_API_KEY,
# KNMI_API_KEY, HA_TOKEN. EVCC_URL and HA_URL only seed the EVCC and Home
# Assistant addresses until they are saved in Settings. Also:
# EVCC_PLANNER_LISTEN, EVCC_PLANNER_DATA_DIR, EVCC_PLANNER_WEB_DIR,
# EVCC_PLANNER_DEMO. Optional overrides of this file go in config.local.yaml
# (ignored).

server:
  listen: 127.0.0.1:7201   # Docker sets 0.0.0.0:7201
  web_dir: web/dist

timezone: Europe/Amsterdam
data_dir: data

evcc:
  mode: live               # live | stub

calendar:
  mode: ical               # ical | stub
  # Environment variable with one or more secret iCal addresses, separated by
  # commas (Google Calendar > Settings > calendar > "Secret address in iCal
  # format"). Calendar names are read from the feeds.
  url_env: GOOGLE_CALENDAR_ICAL_URL

routes:
  mode: google             # google | stub (google without a key falls back to stub)
  api_key_env: GOOGLE_MAPS_API_KEY
  base_url: https://routes.googleapis.com

# Daily advice inputs, fetched once a day (Settings → Connections); the last
# valid forecast is kept when a fetch fails.
tibber:
  mode: live               # live | stub

openrouter:
  mode: live               # live | stub (live without a key uses the pattern-based stub)
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1

knmi:
  mode: live               # live | stub (live without a key: no weather outlook)
  api_key_env: KNMI_API_KEY
  base_url: https://api.dataplatform.knmi.nl/open-data/v1

# Always-on SoC: Home Assistant has the car's SoC also while it is unplugged
# (EVCC only reads it while plugged in). Read-only REST API with a long-lived
# access token from the environment; the address and sensors are edited in
# Settings → Connections (HA_URL seeds the address). Calls to Home Assistant
# are not in the activity log.
homeassistant:
  mode: live               # live | stub
  token_env: HA_TOKEN

# Bootstrap planning defaults. Values saved in Settings take precedence; the
# home address is only set in Settings.
defaults:
  usable_capacity_kwh: 59
  charge_power_kw: 3.68
  consumption_kwh_per_100km: 18
  arrival_reserve_pct: 15
  charging_efficiency_pct: 90
  departure_buffer_min: 15
  charge_buffer_min: 30
  default_stay_min: 15
  auto_plan_on_plug_in: true   # send the next departure's plan to EVCC when the car is plugged in
